<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RimWorld API Documentation Index</title>
    <meta name="description" content="Complete RimWorld API documentation with searchable index of 12,527 API classes, methods, and namespaces">
    <meta name="keywords" content="RimWorld, API, documentation, modding, Unity, C#">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://pkp24.github.io/RimworldAPI_Docx/">
    <link rel="sitemap" type="application/xml" title="Sitemap" href="sitemap.xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            min-height: 600px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h3 {
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .namespace-list {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .namespace-list li {
            margin-bottom: 8px;
        }

        .namespace-list a {
            display: block;
            padding: 8px 12px;
            text-decoration: none;
            color: #555;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .namespace-list a:hover {
            background: #f0f4ff;
            color: #667eea;
            transform: translateX(5px);
        }

        .namespace-list a.active {
            background: #667eea;
            color: white;
        }

        .main-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 10px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            margin: 0 15px;
            color: #666;
        }

        .file-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .file-item a {
            text-decoration: none;
            color: #333;
            display: block;
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: #667eea;
        }

        .file-namespace {
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .filters {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
            }
            
            .file-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RimWorld API Documentation</h1>
            <p>Browse and search through 12,527 API documentation files</p>
        </div>

        <div class="search-container">
            <input type="text" id="searchBox" class="search-box" placeholder="Search for classes, methods, or namespaces...">
            <div class="stats">
                <span id="fileCount">Total files: 12,527</span>
                <span id="filteredCount"></span>
            </div>
        </div>

        <div class="content">
            <div class="sidebar">
                <h3>Namespaces</h3>
                <ul class="namespace-list" id="namespaceList">
                    <li><a href="#" class="namespace-link active" data-namespace="all">All Namespaces</a></li>
                </ul>
            </div>

            <div class="main-content">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="rimworld">RimWorld</button>
                    <button class="filter-btn" data-filter="verse">Verse</button>
                    <button class="filter-btn" data-filter="unity">Unity</button>
                    <button class="filter-btn" data-filter="other">Other</button>
                </div>
                
                <div id="fileGrid" class="file-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading API documentation...</p>
                    </div>
                </div>
                <div id="pagination" class="pagination" style="display: none;">
                    <button id="prevPage" onclick="changePage(-1)">Previous</button>
                    <span class="page-info" id="pageInfo">Page 1 of 1</span>
                    <button id="nextPage" onclick="changePage(1)">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // File data will be loaded here
        let allFiles = [];
        let filteredFiles = [];
        let currentNamespace = 'all';
        let currentFilter = 'all';
        let currentPage = 1;
        let filesPerPage = 100;

        // Load file list
        async function loadFileList() {
            try {
                const response = await fetch('api/file-list.json');
                if (response.ok) {
                    allFiles = await response.json();
                    filteredFiles = [...allFiles];
                    renderFiles();
                    buildNamespaceList();
                    updateStats();
                } else {
                    console.error('Could not load file list');
                    document.getElementById('fileGrid').innerHTML = 
                        '<div class="no-results">Error: Could not load file list. Please ensure file-list.json exists.</div>';
                }
            } catch (error) {
                console.error('Error loading file list:', error);
                document.getElementById('fileGrid').innerHTML = 
                    '<div class="no-results">Error: Could not load file list. Please ensure file-list.json exists.</div>';
            }
        }

        function buildNamespaceList() {
            const namespaces = [...new Set(allFiles.map(f => f.namespace))].sort();
            const namespaceList = document.getElementById('namespaceList');
            
            // Clear existing items except "All"
            const allItem = namespaceList.querySelector('[data-namespace="all"]');
            namespaceList.innerHTML = '';
            namespaceList.appendChild(allItem);

            namespaces.forEach(ns => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'namespace-link';
                a.setAttribute('data-namespace', ns);
                a.textContent = ns;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    selectNamespace(ns);
                });
                li.appendChild(a);
                namespaceList.appendChild(li);
            });
        }

        function selectNamespace(namespace) {
            currentNamespace = namespace;
            
            // Update active state
            document.querySelectorAll('.namespace-link').forEach(link => {
                link.classList.remove('active');
            });
            document.querySelector(`[data-namespace="${namespace}"]`).classList.add('active');
            
            filterFiles();
        }

        function selectFilter(filter) {
            currentFilter = filter;
            
            // Update active state
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
            
            filterFiles();
        }

        function filterFiles() {
            let filtered = allFiles;

            // Apply namespace filter
            if (currentNamespace !== 'all') {
                filtered = filtered.filter(f => f.namespace === currentNamespace);
            }

            // Apply category filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(f => {
                    const ns = f.namespace.toLowerCase();
                    switch (currentFilter) {
                        case 'rimworld': return ns.includes('rimworld');
                        case 'verse': return ns.includes('verse');
                        case 'unity': return ns.includes('unity');
                        case 'other': return !ns.includes('rimworld') && !ns.includes('verse') && !ns.includes('unity');
                        default: return true;
                    }
                });
            }

            // Apply search filter
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(f => 
                    f.name.toLowerCase().includes(searchTerm) ||
                    f.namespace.toLowerCase().includes(searchTerm)
                );
            }

            filteredFiles = filtered;
            currentPage = 1; // Reset to first page when filtering
            renderFiles();
            updateStats();
        }

        function renderFiles() {
            const fileGrid = document.getElementById('fileGrid');
            const pagination = document.getElementById('pagination');
            
            if (filteredFiles.length === 0) {
                fileGrid.innerHTML = '<div class="no-results">No files found matching your criteria.</div>';
                pagination.style.display = 'none';
                return;
            }

            // Calculate pagination
            const totalPages = Math.ceil(filteredFiles.length / filesPerPage);
            const startIndex = (currentPage - 1) * filesPerPage;
            const endIndex = Math.min(startIndex + filesPerPage, filteredFiles.length);
            const pageFiles = filteredFiles.slice(startIndex, endIndex);

            // Render files for current page
            fileGrid.innerHTML = pageFiles.map(file => `
                <div class="file-item">
                    <a href="${file.path}" target="_blank">
                        <div class="file-name">${file.name.replace('.html', '')}</div>
                        <div class="file-namespace">${file.namespace}</div>
                    </a>
                </div>
            `).join('');

            // Update pagination
            if (totalPages > 1) {
                pagination.style.display = 'flex';
                document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${startIndex + 1}-${endIndex} of ${filteredFiles.length})`;
                document.getElementById('prevPage').disabled = currentPage === 1;
                document.getElementById('nextPage').disabled = currentPage === totalPages;
            } else {
                pagination.style.display = 'none';
            }
        }

        function changePage(delta) {
            const totalPages = Math.ceil(filteredFiles.length / filesPerPage);
            const newPage = currentPage + delta;
            
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderFiles();
            }
        }

        function updateStats() {
            document.getElementById('filteredCount').textContent = 
                filteredFiles.length === allFiles.length ? '' : `Showing: ${filteredFiles.length}`;
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', filterFiles);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                selectFilter(e.target.getAttribute('data-filter'));
            });
        });

        // Initialize
        loadFileList();
    </script>
</body>
</html>
